
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي الشخصي</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0b1120;
            color: white;
            text-align: center;
            margin: 0;
            line-height: 1.8;
        }

        header {
            background: #121c30;
            padding: 20px;
        }

        h1 {
            color: #54d6b2;
            font-size: 40px;
        }

        main {
            padding: 70px 20px;
        }

        .card {
            background: #121c30;
            margin: 20px auto;
            padding: 25px;
            max-width: 500px;
            border-radius: 15px;
        }

        a {
            display: inline-block;
            background: #54d6b2;
            color: #07141a;
            padding: 10px 25px;
            border-radius: 8px;
            text-decoration: none;
        }

        footer {
            padding: 20px;
            color: #a9b6c9;
        }
    </style>
</head>

<body>

    <header>
        <h2>موقعي الشخصي</h2>
    </header>

    <main>
        <h1>مرحبا بك!</h1>

        <p>
            أنا أتعلم تصميم المواقع والبرمجة
            وأبدأ رحلتي من الصفر.
        </p>

        <div class="card">
            <h2>من أنا؟</h2>
            <p>هذا أول مشروع لي في عالم تطوير الويب.</p>
            <a href="#about">اكتشف المزيد</a>
        </div>

        <div class="card" id="about">
            <h2>مهاراتي</h2>
            <p>HTML - CSS - JavaScript</p>
        </div>
    </main>

    <footer>
        أول موقع لي على الإنترنت © 2026
    </footer>

</body>
</html>
